    <script>
        (function () {
            var host = document.getElementById('contact-line-art');
            if (!host) return;

            function useObjectFallback() {
                host.innerHTML = '<object type="image/svg+xml" data="../assets/img/contact-us-svg.svg" style="width:100%;height:auto;display:block;"></object>';
            }

            /* file://: fetch() is CORS-blocked; object embed works without console errors */
            if (location.protocol === 'file:') {
                useObjectFallback();
                return;
            }

            fetch('../assets/img/contact-us-svg.svg')
                .then(function (res) { return res.text(); })
                .then(function (svgText) {
                    host.innerHTML = svgText;
                    var path = host.querySelector('.contact-draw-path') || host.querySelector('path');
                    if (!path || typeof path.getTotalLength !== 'function') return;

                    var length = Math.ceil(path.getTotalLength());
                    path.style.setProperty('--path-length', length);
                    path.style.strokeDasharray = String(length);
                    path.style.strokeDashoffset = String(length);
                    path.getBoundingClientRect();
                    path.style.animation = 'none';
                    void path.offsetWidth;
                    path.style.animation = '';
                })
                .catch(function () {
                    useObjectFallback();
                });
        })();
